# Repository checks.
#
# ONE JOB. These are the host-side guards. They are Python only, need no CUDA and no GPU, and
# finish in seconds on a hosted runner. This is the job that must stay green on every change: it is
# what stops a documentation, weight, provenance, test-skip or formatting regression from reaching
# `master`.
#
# THE BUILD AND TEST JOB IS GONE, AND THE REASON IS TWO FACTS RATHER THAN A PREFERENCE.
#
# First, it never ran. Every one of its thirteen runs failed at "Initialize containers", twelve
# seconds in, before it reached the configure step. The image it asked for,
# nvidia/cuda:13.4.92-devel-ubuntu24.04, is not a published tag: the CUDA development image tags on
# Docker Hub are versioned 13.4.3 (13.4.3-devel-ubuntu24.04 and the rest), and 13.4.92 is this
# project's local toolkit version string, which is not a tag. A workflow that fails before its first
# real step reports a red mark on every push and tells nobody anything.
#
# Second, even with a correct tag it would validate little. GitHub-hosted runners have no GPU, so the
# suite would run against the build's own CUDA stub and about 130 of the 242 tests would report
# `SKIP: no usable CUDA device`. That is the designed behaviour of a stubbed run, not a failure, but
# it means the thing this project most needs checked -- that the kernels compute what they claim on
# real hardware -- cannot be checked here at all.
#
# WHAT COVERS THE BUILD INSTEAD. The local gate in AGENTS.md is the authority: a clean build, the
# full ctest run, the six guards below, and `tools/check_duplicate_kernels.py` against the real build
# directory, which needs the linked libraries and therefore a build. The GPU lanes run on the
# project's own hardware and are described in docs/lane.md.
#
# IF A CUDA BUILD JOB IS EVER WANTED BACK, two things are needed and both are cheap: use a tag that
# exists (13.4.3-devel-ubuntu24.04 as of this writing), and keep the duplicate-kernel step after the
# build step because it reads the built libraries. It still will not replace a GPU lane.
name: checks

on:
  push:
    branches: [master]
  pull_request:

concurrency:
  group: checks-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  guards:
    name: repository guards
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: install clang-format
        # Pinned: the tree is formatted with this major version, and clang-format output changes
        # between majors. `tools/check_format.py` prints the version it used.
        run: pip install --disable-pip-version-check "clang-format==23.1.1"
      - name: documentation and source guard
        run: python3 tools/check_docs.py .
      - name: repository weight guard
        run: python3 tools/check_repo_weight.py .
      - name: provenance guard
        run: python3 tools/check_provenance.py .
      - name: test-artifact guard
        run: python3 tools/check_test_artifacts.py .
      - name: test-skip guard
        run: python3 tools/check_test_skips.py .
      - name: formatting guard
        run: python3 tools/check_format.py .
      - name: kernel-staleness guard self-test
        # CPU-only: the runner has no CUDA toolchain and no build directory, so
        # the live audit (tools/check_kernel_staleness.py against build/) is a
        # local-gate step, run after builds on the GPU lanes. What CI verifies
        # here is the guard itself: the synthetic self-test reproduces the tar
        # trap (content changed, mtime old, recompile skipped) and asserts it
        # is caught where an mtime check alone would pass.
        run: python3 tools/check_kernel_staleness.py --self-test
